<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sum of Exterior Angles of Convex Polygons (8-Slide Interactive Presentation)</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif; 
    }
    
    #app-container {
      position: relative;
      width: 1280px;
      height: 720px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    /* Header styling matching presentation */
    .app-header {
      padding: 18px 48px;
      border-bottom: 2px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      z-index: 10;
    }
    .app-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: #0f172a;
    }
    .progress-pill {
      background: #f1f5f9;
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 600;
      color: #64748b;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Slide container */
    .slides-wrapper {
      flex: 1;
      position: relative;
    }
    .slide {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 24px 48px;
      display: flex;
      opacity: 0;
      pointer-events: none;
      transform: translateX(20px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    /* Content Layouts */
    .two-col {
      display: flex;
      gap: 36px;
      width: 100%;
      height: 100%;
      align-items: center;
    }
    .text-col {
      flex: 1.05;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .visual-col {
      flex: 1.0;
      height: 100%;
      background: #f8fafc;
      border-radius: 24px;
      border: 2px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 12px 14px;
    }

    /* Graph paper background */
    .graph-bg {
      background-color: #fbf9f1;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.25) 1px, transparent 1px);

      font-family: 'Playfair Display', serif;
      font-size: 33px;
      color: #0f172a;
      margin-bottom: 10px;
      line-height: 1.18;
    }
    .main-text {
      font-size: 17.5px;
      color: #334155;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .math-blue { color: #0ea5e9; }
    .math-red { color: #e11d48; }
    .math-amber { color: #d97706; }

    /* Step cards */
    .step-card {
      background: #f8fafc;
      border-left: 5px solid #0ea5e9;
      border-radius: 0 12px 12px 0;
      padding: 9px 15px;
      margin-bottom: 9px;
      font-size: 16px;
      color: #1e293b;
      line-height: 1.4;
    }
    .step-card.highlight {

    .step-title {

      margin-bottom: 2px;
      font-size: 12.5px;
      text-transform: uppercase;

    /* Turn Recorder Panel */
    .recorder-card {

      border-radius: 14px;
      padding: 11px 15px;

<body>

  <!-- Reusable SVG Definitions for Arrowheads -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
      </marker>
      <marker id="arrowhead-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48" />
      </marker>
    </defs>
  </svg>

  <div id="app-container">
    <div class="app-header">
      <h1>Exterior Angle Sum of Convex Polygons (<em>n</em> = 3, 4, 5, 10)</h1>
      <div class="progress-pill" id="slide-tracker">Slide 1 of 4 &bull; Triangle (n = 3)</div>
    </div>

    <div class="slides-wrapper" id="slides-wrapper">
      <!-- Slides are dynamically built and hydrated cleanly from unified polygon configurations -->
    </div>

    <div class="controls">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="navigate(-1)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Previous
      </button>

      <div class="slide-tabs" id="slide-tabs" style="gap: 5px; flex-wrap: nowrap;">
        <button class="tab-pill active" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(0)">1. Triangle</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(1)">2. Quad</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(2)">3. Pentagon</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(3)">4. Decagon</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(4)">5. Circle vs 5-gon</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(5)">6. Shrink Proof</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(6)">7. Ext. Sum = 360&deg;</button>
        <button class="tab-pill" style="padding: 5px 10px; font-size: 12.5px;" onclick="goToSlide(7)">8. Checkpoint</button>
      </div>

      <button class="nav-btn btn-next" id="btn-next" onclick="navigate(1)">
        Next
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <script>
    const SUBSCRIPTS = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉', '₁₀'];
    const VERTEX_NAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

    function makeDecagonPreset(variant) {
      const cx = 230, cy = 165;
      const baseR = 112;
      const scalesList = [
        [1.02, 0.94, 1.05, 0.92, 1.00, 1.04, 0.93, 1.03, 0.95, 0.98],
        [0.95, 1.04, 0.96, 1.03, 0.92, 1.05, 0.97, 1.01, 0.94, 1.02],
        [1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]
      ];
      const scales = scalesList[variant % scalesList.length];
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const ang = -Math.PI / 2 + (2 * Math.PI * i) / 10;
        const r = baseR * scales[i];
        pts.push({
          x: cx + r * Math.cos(ang),
          y: cy + r * Math.sin(ang),

      verts: cfg.presets[0].map(v => ({ ...v })),
      presetIdx: 0,
      showInt: true,
      showExt: true,
      cycleT: 0,
      isPlaying: true,
      pauseFrames: 0,
      dragMode: null
    }));

    let currentSlide = 0;

    function isStrictlyConvex(pts) {
      const n = pts.length;
      let sign = 0;
      for (let i = 0; i < n; i++) {
        const a = pts[i];
        const b = pts[(i + 1) % n];
        const c = pts[(i + 2) % n];
        const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
        if (Math.abs(cross) < 40) return false;
        const s = cross > 0 ? 1 : -1;
        if (sign === 0) sign = s;
        else if (sign !== s) return false;
      }
      return sign > 0; // clockwise in screen coordinates (y-down)
    }

    function computeGeometry(st) {
      const n = st.cfg.n;
      const edges = [];
      for (let i = 0; i < n; i++) {
        const p1 = st.verts[i];
        const p2 = st.verts[(i + 1) % n];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        edges.push({
          from: p1,
          to: p2,
          len: Math.hypot(dx, dy),
          ang: Math.atan2(dy, dx)
        });
      }

      const turns = [];
      for (let i = 0; i < n; i++) {
        const eIn = edges[i];
        const eOut = edges[(i + 1) % n];
        let diff = eOut.ang - eIn.ang;
        while (diff <= 0) diff += Math.PI * 2;
        while (diff > Math.PI * 2) diff -= Math.PI * 2;
        const extDeg = (diff * 180) / Math.PI;
        turns.push({
          vertex: eIn.to,
          inAng: eIn.ang,
          outAng: eOut.ang,
          extRad: diff,
          extDeg
        });
      }
      return { edges, turns };
    }

    function renderSlide(sIdx) {
      const st = slideStates[sIdx];
      const cfg = st.cfg;
      const n = cfg.n;
      const { edges, turns } = computeGeometry(st);

      const polyEl = document.getElementById(`${cfg.id}-poly`);
      polyEl.setAttribute('points', st.verts.map(v => `${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));

      const segSize = 1 / n;
      const segIdx = Math.min(n - 1, Math.floor(st.cycleT / segSize));
      const localU = Math.min(1, (st.cycleT - segIdx * segSize) / segSize);
      const edgeFrac = 0.70;

      const turnProgress = new Array(n).fill(0);
      for (let k = 0; k < n; k++) {
        if (st.cycleT >= 0.999) turnProgress[k] = 1;
        else if (k < segIdx) turnProgress[k] = 1;
        else if (k === segIdx && localU >= edgeFrac) {
          turnProgress[k] = (localU - edgeFrac) / (1 - edgeFrac);
        }
      }

      // Compute exact rounded integer exterior angles summing to 360°
      const rawExts = turns.map(t => t.extDeg);
      const roundedExts = rawExts.map(d => Math.round(d));
      const diffSum = 360 - roundedExts.reduce((a, b) => a + b, 0);
      // Adjust largest angle by diffSum so displayed exterior angles always sum to 360°
      let maxIdx = 0;
      for (let k = 1; k < n; k++) if (rawExts[k] > rawExts[maxIdx]) maxIdx = k;
      roundedExts[maxIdx] += diffSum;

      let raysHTML = '';
      let extHTML = '';
      let intHTML = '';

      const rayLen = n === 10 ? 38 : 54;
      const arcR = n === 10 ? 20 : 28;
      const lblOffset = n === 10 ? 15 : 18;
      const fontSizeExt = n === 10 ? '11.2' : '13';

      for (let k = 0; k < n; k++) {
        const tInfo = turns[k];
        const vx = tInfo.vertex.x;
        const vy = tInfo.vertex.y;
        const rx = vx + rayLen * Math.cos(tInfo.inAng);
        const ry = vy + rayLen * Math.sin(tInfo.inAng);

        if (st.showExt) {
          raysHTML += `<line x1="${vx.toFixed(1)}" y1="${vy.toFixed(1)}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="#e11d48" stroke-width="${n === 10 ? '2' : '2.5'}" stroke-dasharray="4 3"/>`;

          const p1x = vx + arcR * Math.cos(tInfo.inAng);
          const p1y = vy + arcR * Math.sin(tInfo.inAng);
          const p2x = vx + arcR * Math.cos(tInfo.outAng);
          const p2y = vy + arcR * Math.sin(tInfo.outAng);

          const isLit = turnProgress[k] > 0.01;
          const fillCol = isLit ? 'rgba(225, 29, 72, 0.28)' : 'rgba(225, 29, 72, 0.08)';
          extHTML += `<path d="M ${vx.toFixed(1)},${vy.toFixed(1)} L ${p1x.toFixed(1)},${p1y.toFixed(1)} A ${arcR},${arcR} 0 0,1 ${p2x.toFixed(1)},${p2y.toFixed(1)} Z" fill="${fillCol}" stroke="#e11d48" stroke-width="${n === 10 ? '1.8' : '2.3'}"/>`;

          const midAng = tInfo.inAng + tInfo.extRad / 2;
          const lx = vx + (arcR + lblOffset) * Math.cos(midAng);
          const ly = vy + (arcR + lblOffset) * Math.sin(midAng) + 4;
          const labelTxt = n === 10 ? `${roundedExts[k]}°` : `e${SUBSCRIPTS[k]}=${roundedExts[k]}°`;
          extHTML += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-weight="700" font-size="${fontSizeExt}" fill="#be123c">${labelTxt}</text>`;
        }
      }

      if (st.showInt) {
        const rIn = n === 10 ? 18 : 24;
        const inLblOffset = n === 10 ? 14 : 18;
        const fontSizeInt = n === 10 ? '10.8' : '12.5';

        for (let i = 0; i < n; i++) {
          const curr = st.verts[i];
          const prev = st.verts[(i + n - 1) % n];
          const next = st.verts[(i + 1) % n];
          const a1 = Math.atan2(next.y - curr.y, next.x - curr.x);
          const a2 = Math.atan2(prev.y - curr.y, prev.x - curr.x);

          let sweep = a2 - a1;
          while (sweep < 0) sweep += Math.PI * 2;
          while (sweep >= Math.PI * 2) sweep -= Math.PI * 2;

          const s1x = curr.x + rIn * Math.cos(a1);
          const s1y = curr.y + rIn * Math.sin(a1);
          const s2x = curr.x + rIn * Math.cos(a2);
          const s2y = curr.y + rIn * Math.sin(a2);

          intHTML += `<path d="M ${curr.x.toFixed(1)},${curr.y.toFixed(1)} L ${s1x.toFixed(1)},${s1y.toFixed(1)} A ${rIn},${rIn} 0 0,1 ${s2x.toFixed(1)},${s2y.toFixed(1)} Z" fill="rgba(14, 165, 233, 0.16)" stroke="#0284c7" stroke-width="${n === 10 ? '1.8' : '2.2'}"/>`;

          // Vertex i corresponds to turn (i + n - 1) % n
          const turnIdx = (i + n - 1) % n;
          const inDeg = 180 - roundedExts[turnIdx];
          const midIn = a1 + sweep / 2;
          const lx = curr.x + (rIn + inLblOffset) * Math.cos(midIn);
          const ly = curr.y + (rIn + inLblOffset) * Math.sin(midIn) + 4;
          const inTxt = n === 10 ? `${inDeg}°` : `i${SUBSCRIPTS[turnIdx]}=${inDeg}°`;
          intHTML += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-weight="700" font-size="${fontSizeInt}" fill="#0369a1">${inTxt}</text>`;
        }
      }

      document.getElementById(`${cfg.id}-ext-rays`).innerHTML = raysHTML;
      document.getElementById(`${cfg.id}-ext-angles`).innerHTML = extHTML;
      document.getElementById(`${cfg.id}-int-angles`).innerHTML = intHTML;

      // Render vertex handles & labels
      const cx = st.verts.reduce((s, v) => s + v.x, 0) / n;
      const cy = st.verts.reduce((s, v) => s + v.y, 0) / n;
      let vHTML = '';
      for (let i = 0; i < n; i++) {
        const v = st.verts[i];
        const outAng = Math.atan2(v.y - cy, v.x - cx);
        const distOut = n === 10 ? 15 : 19;
        const lx = v.x + distOut * Math.cos(outAng);
        const ly = v.y + distOut * Math.sin(outAng) + 5;
        vHTML += `<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="13" fill="rgba(15,23,42,0.05)" style="cursor:move;"/>`;
        vHTML += `<circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="${n === 10 ? '4.5' : '5.5'}" fill="#0f172a" stroke="#ffffff" stroke-width="1.8" style="cursor:move;"/>`;
        vHTML += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="700" font-size="${n === 10 ? '15' : '18'}" fill="#0f172a">${v.name}</text>`;
      }
      document.getElementById(`${cfg.id}-vertices`).innerHTML = vHTML;

      // Position Point P
      const activeEdge = edges[segIdx];
      const activeTurn = turns[segIdx];
      let px, py, headingRad;

      if (st.cycleT >= 0.999) {
        px = st.verts[0].x;
        py = st.verts[0].y;
        headingRad = edges[0].ang;
      } else if (localU < edgeFrac) {
        const f = localU / edgeFrac;
        px = activeEdge.from.x + (activeEdge.to.x - activeEdge.from.x) * f;
        py = activeEdge.from.y + (activeEdge.to.y - activeEdge.from.y) * f;
        headingRad = activeEdge.ang;
      } else {
        const f = (localU - edgeFrac) / (1 - edgeFrac);
        px = activeTurn.vertex.x;
        py = activeTurn.vertex.y;
        headingRad = activeTurn.inAng + activeTurn.extRad * f;
      }

      const headingDeg = (headingRad * 180) / Math.PI;
      document.getElementById(`${cfg.id}-point-P`).setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)}) rotate(${headingDeg.toFixed(1)})`);

      // Update live turn recorder
      let totalCur = 0;
      for (let k = 0; k < n; k++) {
        const curVal = Math.round(roundedExts[k] * turnProgress[k]);
        totalCur += curVal;
        document.getElementById(`${cfg.id}-val-${k}`).textContent = `${curVal}°`;
        document.getElementById(`${cfg.id}-eq-${k}`).textContent = `${curVal}°`;

        const pill = document.getElementById(`${cfg.id}-pill-${k}`);
        pill.classList.remove('active', 'done');
        if (turnProgress[k] >= 0.99) pill.classList.add('done');
        else if (turnProgress[k] > 0.01) pill.classList.add('active');
      }

      document.getElementById(`${cfg.id}-eq-sum`).textContent = `${totalCur}°`;
      document.getElementById(`${cfg.id}-rec-total`).textContent = `Total Turn: ${totalCur}° / 360°`;

      const pct = Math.round(st.cycleT * 100);
      document.getElementById(`${cfg.id}-slider`).value = Math.round(st.cycleT * 1000);
      document.getElementById(`${cfg.id}-pct`).textContent = `${pct}%`;

      const statusEl = document.getElementById(`${cfg.id}-status`);
      if (totalCur === 360) {
        statusEl.textContent = `1 Complete Cycle: Sum of all ${n} exterior turns = 360°!`;
      } else if (localU >= edgeFrac) {
        statusEl.textContent = `Pivoting at Vertex ${activeTurn.vertex.name} through exterior angle e${SUBSCRIPTS[segIdx]}...`;
      } else {
        statusEl.textContent = `Moving straight along side ${activeEdge.from.name}${activeEdge.to.name} (0° turn)`;
      }
    }

    // Controls per slide
    function toggleInterior(sIdx) {
      const st = slideStates[sIdx];
      st.showInt = !st.showInt;
      const btn = document.getElementById(`${st.cfg.id}-btn-int`);
      btn.textContent = st.showInt ? 'Hide Interior ∠s' : 'Show Interior ∠s';
      btn.classList.toggle('active-blue', st.showInt);
      renderSlide(sIdx);
    }

    function toggleExterior(sIdx) {
      const st = slideStates[sIdx];
      st.showExt = !st.showExt;
      const btn = document.getElementById(`${st.cfg.id}-btn-ext`);
      btn.textContent = st.showExt ? 'Hide Exterior ∠s' : 'Show Exterior ∠s';
      btn.classList.toggle('active-red', st.showExt);
      renderSlide(sIdx);
    }

    function randomizePolygon(sIdx) {
      const st = slideStates[sIdx];
      st.presetIdx = (st.presetIdx + 1) % st.cfg.presets.length;
      const base = st.cfg.presets[st.presetIdx];
      const jitter = st.cfg.n === 10 ? 6 : 14;
      const candidate = base.map(v => ({
        x: v.x + (Math.random() * jitter * 2 - jitter),
        y: v.y + (Math.random() * jitter * 2 - jitter),
        name: v.name
      }));
      st.verts = isStrictlyConvex(candidate) ? candidate : base.map(v => ({ ...v }));
      renderSlide(sIdx);
    }

    function onCycleSlider(sIdx, val) {
      const st = slideStates[sIdx];
      st.isPlaying = false;
      document.getElementById(`${st.cfg.id}-btn-play`).textContent = 'Play';
      st.cycleT = Number(val) / 1000;
      renderSlide(sIdx);
    }

    function togglePlay(sIdx) {
      const st = slideStates[sIdx];
      st.isPlaying = !st.isPlaying;
      if (st.isPlaying && st.cycleT >= 0.999) st.cycleT = 0;
      document.getElementById(`${st.cfg.id}-btn-play`).textContent = st.isPlaying ? 'Pause' : 'Play';
    }

    function resetCycle(sIdx) {
      const st = slideStates[sIdx];
      st.isPlaying = false;
      st.cycleT = 0;
      st.pauseFrames = 0;
      document.getElementById(`${st.cfg.id}-btn-play`).textContent = 'Play';
      renderSlide(sIdx);
    }

    // Pointer interaction setup for each slide's SVG
    function getSvgCoords(svgEl, evt) {
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const pt = svgEl.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svgEl.getScreenCTM();
      if (ctm) {
        const res = pt.matrixTransform(ctm.inverse());
        return { x: res.x, y: res.y };
      }
      const rect = svgEl.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * 460,
        y: ((clientY - rect.top) / rect.height) * 365
      };
    }

    function projectOntoPerimeter(st, pt) {
      const n = st.cfg.n;
      let bestDist = Infinity;
      let bestT = 0;
      const segSize = 1 / n;
      const edgeFrac = 0.70;
      for (let i = 0; i < n; i++) {
        const a = st.verts[i];
        const b = st.verts[(i + 1) % n];
        const vx = b.x - a.x;
        const vy = b.y - a.y;
        const wx = pt.x - a.x;
        const wy = pt.y - a.y;
        const lenSq = vx * vx + vy * vy;
        const u = Math.max(0, Math.min(1, (wx * vx + wy * vy) / lenSq));
        const px = a.x + u * vx;
        const py = a.y + u * vy;
        const d = Math.hypot(pt.x - px, pt.y - py);
        if (d < bestDist) {
          bestDist = d;
          if (u > 0.94) {
            bestT = i * segSize + 0.85 * segSize;
          } else {
            bestT = i * segSize + u * edgeFrac * segSize;
          }
        }
      }
      return bestT;
    }

    SLIDE_CONFIGS.forEach((cfg, sIdx) => {
      const svgEl = document.getElementById(`${cfg.id}-svg`);
      svgEl.addEventListener('pointerdown', (e) => {
        const st = slideStates[sIdx];
        const pt = getSvgCoords(svgEl, e);
        for (let i = 0; i < cfg.n; i++) {
          if (Math.hypot(pt.x - st.verts[i].x, pt.y - st.verts[i].y) < 16) {
            st.dragMode = i;
            return;
          }
        }
        st.isPlaying = false;
        document.getElementById(`${cfg.id}-btn-play`).textContent = 'Play';
        st.dragMode = 'P';
        const rawT = projectOntoPerimeter(st, pt);
        if (st.cycleT > 0.88 && rawT < 0.10) st.cycleT = 1;
        else if (st.cycleT < 0.10 && rawT > 0.88) st.cycleT = 0;
        else st.cycleT = rawT;
        renderSlide(sIdx);
      });
    });

    window.addEventListener('pointermove', (e) => {
      if (currentSlide >= slideStates.length) return;
      const st = slideStates[currentSlide];
      if (!st || st.dragMode === null) return;
      const svgEl = document.getElementById(`${st.cfg.id}-svg`);
      const pt = getSvgCoords(svgEl, e);
      if (typeof st.dragMode === 'number') {
        const idx = st.dragMode;
        const testVerts = st.verts.map((v, i) =>
          i === idx
            ? { ...v, x: Math.max(55, Math.min(405, pt.x)), y: Math.max(45, Math.min(285, pt.y)) }
            : v
        );
        // Only apply vertex drag if polygon remains strictly convex
        if (isStrictlyConvex(testVerts)) {
          st.verts = testVerts;
          renderSlide(currentSlide);
        }
      } else if (st.dragMode === 'P') {
        const rawT = projectOntoPerimeter(st, pt);
        if (st.cycleT > 0.88 && rawT < 0.10) st.cycleT = 1;
        else if (st.cycleT < 0.10 && rawT > 0.88) st.cycleT = 0;
        else st.cycleT = rawT;
        renderSlide(currentSlide);
      }
    });

    window.addEventListener('pointerup', () => {
      slideStates.forEach(st => { st.dragMode = null; });
    });

    const TOTAL_SLIDES = 8;
    const EXTRA_SLIDE_LABELS = [
      'Circle vs. Pentagon Turn',
      'Visual Proof: Shrinking to a Point',
      'Sum of Exterior Angles = 360°',
      'Exterior Angles Checkpoint Quiz'
    ];

    // Slide Navigation
    function updateNavUI() {
      document.querySelectorAll('.slide').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentSlide);
      });
      document.querySelectorAll('.tab-pill').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentSlide);
      });
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      document.getElementById('btn-next').disabled = currentSlide === TOTAL_SLIDES - 1;
      if (currentSlide < SLIDE_CONFIGS.length) {
        const cfg = SLIDE_CONFIGS[currentSlide];
        document.getElementById('slide-tracker').textContent = `Slide ${currentSlide + 1} of ${TOTAL_SLIDES} • ${cfg.shortName} (n = ${cfg.n})`;
      } else {
        const label = EXTRA_SLIDE_LABELS[currentSlide - SLIDE_CONFIGS.length];
        document.getElementById('slide-tracker').textContent = `Slide ${currentSlide + 1} of ${TOTAL_SLIDES} • ${label}`;
      }

      if (typeof startTurnLoop === 'function') {
        if (currentSlide === 4) startTurnLoop();
        else stopTurnLoop();
      }
      if (typeof startShrinkLoop === 'function') {
        if (currentSlide === 5) startShrinkLoop();
        else stopShrinkLoop();
      }
    }

    function navigate(dir) {
      goToSlide(currentSlide + dir);
    }

    function goToSlide(idx) {
      currentSlide = Math.max(0, Math.min(TOTAL_SLIDES - 1, idx));
      updateNavUI();
      if (currentSlide < SLIDE_CONFIGS.length) {
        renderSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') navigate(1);
      if (e.key === 'ArrowLeft') navigate(-1);
    });

    // Master animation loop (only animates active slide when on slides 0..3)
    function animate() {
      if (currentSlide < slideStates.length) {
        const st = slideStates[currentSlide];
        if (st && st.isPlaying && st.dragMode === null) {
          if (st.pauseFrames > 0) {
            st.pauseFrames--;
            if (st.pauseFrames === 0) st.cycleT = 0;
          } else {
            const speed = st.cfg.n === 10 ? 0.0018 : 0.0024;
            st.cycleT += speed;
            if (st.cycleT >= 1) {
              st.cycleT = 1;
              st.pauseFrames = 110;
            }
            renderSlide(currentSlide);
          }
        }
      }
      requestAnimationFrame(animate);
    }

    function fitToViewport() {
      const app = document.getElementById('app-container');
      const scaleX = (window.innerWidth - 24) / 1280;
      const scaleY = (window.innerHeight - 24) / 720;
      const scale = Math.min(1, scaleX, scaleY);
      app.style.transform = `scale(${scale})`;
      app.style.transformOrigin = 'center center';
    }


    /* =====================================================================
       SLIDE 6 INTERACTIVE ENGINE: Moving Point A on Circle vs Pentagon
       ===================================================================== */
    const turnCircleArc = document.getElementById('turn-circle-arc');
    const turnCircleA = document.getElementById('turn-circle-a');
    const turnCircleReadout = document.getElementById('turn-circle-readout');
    const turnPentPoly = document.getElementById('turn-pent-poly');
    const turnPentWedges = document.getElementById('turn-pent-wedges');
    const turnPentRays = document.getElementById('turn-pent-rays');
    const turnPentA = document.getElementById('turn-pent-a');
    const turnPentReadout = document.getElementById('turn-pent-readout');
    const turnSlider = document.getElementById('turn-slider');
    const turnPct = document.getElementById('turn-pct');

    const tcCx = 112, tcCy = 148, tcR = 68;
    const tpVerts = [
      { x: 342, y: 74 },
      { x: 416, y: 128 },
      { x: 388, y: 216 },
      { x: 296, y: 216 },
      { x: 268, y: 128 }
    ];
    turnPentPoly.setAttribute('points', tpVerts.map(v => `${v.x},${v.y}`).join(' '));

    // Precompute pentagon edges, lengths, headings, and corner turn angles
    const tpEdges = [];
    let tpTotalLen = 0;
    for (let i = 0; i < 5; i++) {
      const a = tpVerts[i];
      const b = tpVerts[(i + 1) % 5];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const ang = Math.atan2(b.y - a.y, b.x - a.x); // radians
      tpEdges.push({ a, b, len, ang, startDist: tpTotalLen });
      tpTotalLen += len;
    }

    // Draw dashed ray extensions and exterior arcs at each corner
    let raysHTML = '';
    for (let i = 0; i < 5; i++) {
      const prevEdge = tpEdges[(i + 4) % 5];
      const v = tpVerts[i];
      const rx = v.x + 34 * Math.cos(prevEdge.ang);
      const ry = v.y + 34 * Math.sin(prevEdge.ang);
      raysHTML += `<line x1="${v.x}" y1="${v.y}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>`;
    }
    turnPentRays.innerHTML = raysHTML;

    const turnSvg = document.getElementById('svg-turn');
    const turnStatus = document.getElementById('turn-status');
    let turnT = 0; // 0 to 1
    let turnPlaying = true;
    let turnPause = 0;
    let turnRaf = null;
    let turnMode = 'auto'; // 'auto' | 'hand'
    let turnDragTarget = null; // 'circle' | 'pentagon' | null

    function setTurnMode(mode) {
      turnMode = mode;
      document.getElementById('turn-mode-auto').classList.toggle('active', mode === 'auto');
      document.getElementById('turn-mode-hand').classList.toggle('active', mode === 'hand');
      if (mode === 'hand') {
        turnPlaying = false;
        document.getElementById('turn-play-btn').textContent = 'Play';
        turnStatus.textContent = 'Hand-Draft Mode: Drag Point A directly around the circle or pentagon';
      } else {
        turnPlaying = true;
        document.getElementById('turn-play-btn').textContent = 'Pause';
        turnStatus.textContent = '1 complete loop = 360° total change in direction';
      }
    }

    function getTurnSvgCoords(evt) {
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      const pt = turnSvg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = turnSvg.getScreenCTM();
      if (ctm) {
        const svgPt = pt.matrixTransform(ctm.inverse());
        return { x: svgPt.x, y: svgPt.y };
      }
      const rect = turnSvg.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * 460,
        y: ((clientY - rect.top) / rect.height) * 340
      };
    }

    // Project mouse point onto pentagon perimeter and return normalized t in [0, 1]
    function projectOntoPentagonT(pt) {
      let bestDist = Infinity;
      let bestT = 0;
      const segTotal = 0.2;
      for (let i = 0; i < 5; i++) {
        const edge = tpEdges[i];
        const vx = edge.b.x - edge.a.x;
        const vy = edge.b.y - edge.a.y;
        const wx = pt.x - edge.a.x;
        const wy = pt.y - edge.a.y;
        const lenSq = vx * vx + vy * vy;
        let u = Math.max(0, Math.min(1, (wx * vx + wy * vy) / lenSq));
        const projX = edge.a.x + u * vx;
        const projY = edge.a.y + u * vy;
        const dist = Math.hypot(pt.x - projX, pt.y - projY);
        if (dist < bestDist) {
          bestDist = dist;
          // Map u in [0,1] along edge i to segment t in [i*0.2, i*0.2 + 0.144]
          // If very close to end vertex, snap into corner pivot zone
          if (u > 0.96) {
            bestT = i * segTotal + 0.18;
          } else {
            bestT = i * segTotal + u * 0.144;
          }
        }
      }
      return bestT;
    }

      const pt = getTurnSvgCoords(e);
      const distCircle = Math.abs(Math.hypot(pt.x - tcCx, pt.y - tcCy) - tcR);
      if (pt.x < 225 && distCircle < 34) {
        setTurnMode('hand');
        turnDragTarget = 'circle';

      } else if (pt.x >= 225) {

        turnDragTarget = 'pentagon';

    });

    function updateTurnFromDrag(pt) {
      if (turnDragTarget === 'circle') {
        let ang = Math.atan2(pt.y - tcCy, pt.x - tcCx) + Math.PI / 2;
        if (ang < 0) ang += Math.PI * 2;
        // Handle wrap near 360 deg cleanly
        const rawT = ang / (Math.PI * 2);
        if (turnT > 0.85 && rawT < 0.15) turnT = 1;
        else if (turnT < 0.15 && rawT > 0.85) turnT = 0;
        else turnT = rawT;
        renderTurn(turnT);
      } else if (turnDragTarget === 'pentagon') {
        const rawT = projectOntoPentagonT(pt);
        if (turnT > 0.85 && rawT < 0.12) turnT = 1;
        else if (turnT < 0.12 && rawT > 0.85) turnT = 0;
        else turnT = rawT;

    function renderTurn(t) {
      // 1. Circle side
      const theta = t * Math.PI * 2; // 0 to 2pi clockwise from top (-pi/2)
      const posAng = -Math.PI / 2 + theta;
      const ax = tcCx + tcR * Math.cos(posAng);
      const ay = tcCy + tcR * Math.sin(posAng);
      const tanDeg = (theta * 180) / Math.PI;
      turnCircleA.setAttribute('transform', `translate(${ax.toFixed(1)}, ${ay.toFixed(1)}) rotate(${tanDeg.toFixed(1)})`);

      if (t <= 0.002) {
        turnCircleArc.setAttribute('d', '');
      } else if (t >= 0.998) {
        turnCircleArc.setAttribute('d', `M ${tcCx},${tcCy - tcR} A ${tcR},${tcR} 0 1,1 ${tcCx - 0.1},${tcCy - tcR} L ${tcCx},${tcCy} Z`);
      } else {
        const largeArc = theta > Math.PI ? 1 : 0;
        turnCircleArc.setAttribute('d', `M ${tcCx},${tcCy} L ${tcCx},${tcCy - tcR} A ${tcR},${tcR} 0 ${largeArc},1 ${ax.toFixed(1)},${ay.toFixed(1)} Z`);
      }
      const cDeg = Math.round(t * 360);
      turnCircleReadout.textContent = `Turned: ${cDeg}° / 360°`;

      // 2. Pentagon side (with smooth corner pivot pauses so students see the discrete exterior angle turn)
      // Divide t into 5 segments, each having 72% edge travel + 28% corner pivot
      const segTotal = 0.2;
      const segIdx = Math.min(4, Math.floor(t / segTotal));
      const localU = Math.min(1, (t - segIdx * segTotal) / segTotal);

      const edge = tpEdges[segIdx];
      const nextEdge = tpEdges[(segIdx + 1) % 5];

      let h1 = edge.ang;
      let h2 = nextEdge.ang;
      let diff = h2 - h1;
      while (diff <= 0) diff += Math.PI * 2;
      while (diff > Math.PI * 2) diff -= Math.PI * 2;

      let px, py, headRad, completedTurns;
      if (localU < 0.72) {
        const f = localU / 0.72;
        px = edge.a.x + (edge.b.x - edge.a.x) * f;
        py = edge.a.y + (edge.b.y - edge.a.y) * f;
        headRad = h1;
        completedTurns = segIdx * 72;
      } else {
        const f = (localU - 0.72) / 0.28;
        px = edge.b.x;
        py = edge.b.y;
        headRad = h1 + diff * f;
        completedTurns = segIdx * 72 + Math.round(f * 72);
      }

      if (t >= 0.998) {
        px = tpVerts[0].x;
        py = tpVerts[0].y;
        headRad = tpEdges[0].ang;
        completedTurns = 360;
      }

      const headDeg = (headRad * 180) / Math.PI;
      turnPentA.setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)}) rotate(${headDeg.toFixed(1)})`);

      // Highlight completed exterior corner wedges
      let wedgesHTML = '';
      const numLit = t >= 0.998 ? 5 : segIdx + (localU >= 0.72 ? 1 : 0);
      for (let k = 0; k < numLit; k++) {
        const cornerIdx = (k + 1) % 5;
        const v = tpVerts[cornerIdx];
        const aIn = tpEdges[k].ang;
        const aOut = tpEdges[cornerIdx].ang;
        const rW = 24;
        const p1x = v.x + rW * Math.cos(aIn);
        const p1y = v.y + rW * Math.sin(aIn);
        const p2x = v.x + rW * Math.cos(aOut);
        const p2y = v.y + rW * Math.sin(aOut);
        wedgesHTML += `<path d="M ${v.x},${v.y} L ${p1x.toFixed(1)},${p1y.toFixed(1)} A ${rW},${rW} 0 0,1 ${p2x.toFixed(1)},${p2y.toFixed(1)} Z" fill="rgba(2,132,199,0.28)" stroke="#0284c7" stroke-width="2"/>`;
      }
      turnPentWedges.innerHTML = wedgesHTML;
      turnPentReadout.textContent = `Exterior Turn: ${completedTurns}° / 360°`;

      const pct = Math.round(t * 100);
      turnSlider.value = pct;
      turnPct.textContent = `${pct}%`;
    }

    const shrinkCenter = { x: 210, y: 170 };
    const basePentagon = [
      { x: 210, y: 58 },
      { x: 324, y: 136 },
      { x: 282, y: 266 },

      { x: 96, y: 136 }
    ];
    const wedgeColors = [
      'rgba(225, 29, 72, 0.28)',
      'rgba(14, 165, 233, 0.28)',
      'rgba(217, 119, 6, 0.28)',
      'rgba(16, 185, 129, 0.28)',
      'rgba(139, 92, 246, 0.28)'
    ];
    const wedgeStrokes = ['#e11d48', '#0284c7', '#d97706', '#059669', '#7c3aed'];

    let shrinkFactor = 0;
    let shrinkPlaying = true;
    let shrinkDir = 1;
    let shrinkPauseFrames = 0;
    let shrinkRaf = null;

    function renderShrink(t) {
      const scale = 1 - t;
      const verts = basePentagon.map(v => ({
        x: shrinkCenter.x + (v.x - shrinkCenter.x) * scale,
        y: shrinkCenter.y + (v.y - shrinkCenter.y) * scale
      }));

      shrinkPoly.setAttribute('points', verts.map(v => `${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));
      shrinkPoly.style.opacity = t > 0.98 ? '0' : '1';

      let wedgeHTML = '';
      let rayHTML = '';
      const wedgeR = 46 + t * 24;

      for (let i = 0; i < 5; i++) {
        const prev = basePentagon[(i + 4) % 5];
        const curr = basePentagon[i];
        const next = basePentagon[(i + 1) % 5];

        const dirExt = Math.atan2(curr.y - prev.y, curr.x - prev.x);
        const dirOut = Math.atan2(next.y - curr.y, next.x - curr.x);

        const vx = verts[i].x;
        const vy = verts[i].y;

        const p1x = vx + wedgeR * Math.cos(dirExt);
        const p1y = vy + wedgeR * Math.sin(dirExt);
        const p2x = vx + wedgeR * Math.cos(dirOut);
        const p2y = vy + wedgeR * Math.sin(dirOut);

        wedgeHTML += `<path d="M ${vx.toFixed(1)},${vy.toFixed(1)} L ${p1x.toFixed(1)},${p1y.toFixed(1)} A ${wedgeR},${wedgeR} 0 0,1 ${p2x.toFixed(1)},${p2y.toFixed(1)} Z" fill="${wedgeColors[i]}" stroke="${wedgeStrokes[i]}" stroke-width="2.5"/>`;

        const rayLen = wedgeR + 18;
        const rx = vx + rayLen * Math.cos(dirExt);
        const ry = vy + rayLen * Math.sin(dirExt);
        rayHTML += `<line x1="${vx.toFixed(1)}" y1="${vy.toFixed(1)}" x2="${rx.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="${wedgeStrokes[i]}" stroke-width="2.5" stroke-dasharray="5 4"/>`;

        let diff = dirOut - dirExt;
        if (diff < 0) diff += Math.PI * 2;
        const midAng = dirExt + diff / 2;
        const lr = wedgeR * 0.64;
        const lx = vx + lr * Math.cos(midAng);
        const ly = vy + lr * Math.sin(midAng) + 5;
        wedgeHTML += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">e${i + 1}</text>`;
      }

      shrinkWedges.innerHTML = wedgeHTML;
      shrinkRays.innerHTML = rayHTML;

      const pct = Math.round(t * 100);
      shrinkSlider.value = pct;
      shrinkPct.textContent = `${pct}%`;

      if (pct >= 98) {
        shrinkStatus.textContent = `Contraction: 100% — e₁ + e₂ + e₃ + e₄ + e₅ = 360° around P!`;
      } else {
        shrinkStatus.textContent = `Contraction: ${pct}% — Parallel sides preserve exterior angles`;
      }
    }

    function resetShrinkAnim() {

    function startShrinkLoop() {

          {

            diffClass: "q-pill-diff-expert",

            prompt: "4. An irregular convex <em>n</em>-gon has four exterior angles measuring <strong>30&deg;, 40&deg;, 45&deg;, and 65&deg;</strong>, while each remaining <strong>(<em>n</em> &minus; 4)</strong> interior angle measures <strong>165&deg;</strong>. Find <em>n</em>.",
            options: ["14", "15", "16", "17"],
            correct: 2,
            explanation: "Remaining exterior angles = 180&deg; &minus; 165&deg; = 15&deg;. 180 + 15(<em>n</em> &minus; 4) = 360 &rArr; 15(<em>n</em> &minus; 4) = 180 &rArr; <em>n</em> &minus; 4 = 12 &rArr; <em>n</em> = <strong>16</strong>.",
            svg: `<polygon points="142.0,62.0 218.0,62.0 272.0,112.0 272.0,178.0 218.0,228.0 142.0,228.0 88.0,178.0 88.0,112.0" fill="rgba(225,29,72,0.06)" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>
                  <line x1="142.0" y1="62.0" x2="166.9" y2="38.9" stroke="#e11d48" stroke-width="2.2" stroke-dasharray="4 3"/>

                  <text x="180" y="173" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">Remaining (n &minus; 4) int. = 165&deg;</text>

    };

    const miniQuizBank = {
      intq: { setIdx: 0, idx: 0, score: 0, answered: [null, null, null, null] },
      extq: { setIdx: 0, idx: 0, score: 0, answered: [null, null, null, null] }
    };

    function getActiveMiniQuestions(prefix) {
      const state = miniQuizBank[prefix];
      return miniQuizSets[prefix][state.setIdx];
    }

    function renderMiniQuiz(prefix) {
      const state = miniQuizBank[prefix];
      const questions = getActiveMiniQuestions(prefix);
      const q = questions[state.idx];
      const setLabel = String.fromCharCode(65 + state.setIdx);

      document.getElementById(`${prefix}-counter`).textContent = `Set ${setLabel} • ${state.idx + 1} / 4`;
      const badge = document.getElementById(`${prefix}-diff-badge`);
      badge.textContent = q.level;
      badge.className = `q-pill ${q.diffClass}`;
      document.getElementById(`${prefix}-topic-tag`).textContent = q.topic;
      document.getElementById(`${prefix}-score-display`).textContent = `Checkpoint Score: ${state.score} / 4`;
      document.getElementById(`${prefix}-prompt`).innerHTML = q.prompt;
      document.getElementById(`${prefix}-svg`).innerHTML = q.svg;

      const chosen = state.answered[state.idx];
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`${prefix}-opt-${i}`);
        document.getElementById(`${prefix}-opt-text-${i}`).innerHTML = q.options[i];
        btn.classList.remove('correct', 'wrong');
        btn.disabled = (chosen !== null);
        if (chosen !== null) {
          if (i === q.correct) btn.classList.add('correct');
          else if (i === chosen) btn.classList.add('wrong');
        }
      }

      const fb = document.getElementById(`${prefix}-feedback`);
      const fbText = document.getElementById(`${prefix}-feedback-text`);
      const prevBtn = document.getElementById(`${prefix}-prev-btn`);
      const nextBtn = document.getElementById(`${prefix}-next-btn`);

      prevBtn.disabled = (state.idx === 0);

      if (chosen === null) {
        fb.className = 'quiz-feedback';
        fbText.innerHTML = 'Select option <strong>A, B, C, or D</strong> above to check your understanding.';
        nextBtn.disabled = true;
        nextBtn.textContent = state.idx === 3 ? 'Completed ✓' : 'Next →';
      } else {
        const isRight = (chosen === q.correct);
        fb.className = `quiz-feedback ${isRight ? 'fb-correct' : 'fb-wrong'}`;
        const tag = isRight ? '<strong>Correct!</strong> ' : '<strong>Not quite.</strong> ';
        fbText.innerHTML = tag + q.explanation;
        nextBtn.disabled = (state.idx === 3);
        nextBtn.textContent = state.idx === 3 ? 'Done ✓' : 'Next →';
      }
    }

    function selectMiniOption(prefix, optIdx) {
      const state = miniQuizBank[prefix];
      const questions = getActiveMiniQuestions(prefix);
      if (state.answered[state.idx] !== null) return;
      state.answered[state.idx] = optIdx;
      if (optIdx === questions[state.idx].correct) {
        state.score++;
      }
      renderMiniQuiz(prefix);
    }

    function stepMiniQuiz(prefix, dir) {
      const state = miniQuizBank[prefix];
      state.idx = Math.max(0, Math.min(3, state.idx + dir));
      renderMiniQuiz(prefix);
    }

    function resetMiniQuiz(prefix) {
      const state = miniQuizBank[prefix];
      state.setIdx = (state.setIdx + 1) % miniQuizSets[prefix].length;
      state.idx = 0;
      state.score = 0;
      state.answered = [null, null, null, null];
      renderMiniQuiz(prefix);
    }

    
    renderMiniQuiz('extq');

    window.addEventListener('resize', fitToViewport);
    fitToViewport();
    SLIDE_CONFIGS.forEach((_, i) => renderSlide(i));
    updateNavUI();
    animate();
  </script>
